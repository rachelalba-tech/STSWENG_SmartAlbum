
name: CI

on:
  pull_request:
    branches: [main]
  push: 
    branches: [main]

jobs:
  frontend:
    name: Build Frontend and Run Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run EsLint
        run: npm run lint

      - name: Run Vitest
        run: npm run test

      - name: Build React app
        run: npm run build

  server:
    name: Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test album API
        run: npm test

 
  browser:
    name: Robot Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Robot dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run isolated browser suites
        run: node --experimental-strip-types tests/run-browser.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-browser-results
          path: tests/results/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [frontend, server, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: staging

    steps:
      - name: Deploy Backend to Render
        env :
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_STAGING_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"

      - name: Deploy Frontend to Render
        env: 
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_STAGING_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL"

  deploy-production: # needs manual approval
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
    
    steps:
      - name: Deploy Backend to Render
        env :
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_PROD_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"

      - name: Deploy Frontend to Render
        env: 
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_PROD_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL"
